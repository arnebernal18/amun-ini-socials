<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amun Ini Resort & Spa | Follow Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f1e9;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 55px 22px 40px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin: 0 0 38px;
    }

    .social-card {
      display: block;
      width: 100%;
      padding: 22px 20px;
      margin-bottom: 18px;
      background: #ffffff;
      border-radius: 15px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .social-card:active {
      transform: scale(0.98);
    }

    .social-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .social-name {
      font-size: 15px;
      color: #666;
    }

    .tap {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">AMUN INI</div>

    <p class="subtitle">
      Resort & Spa · Anda, Bohol
    </p>

    <a
      class="social-card"
      href="https://www.facebook.com/amuniniresort"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-title">Facebook</div>
      <div class="social-name">Amun Ini Resort & Spa</div>
      <div class="tap">FOLLOW US →</div>
    </a>

    <a
      class="social-card"
      href="https://www.instagram.com/amun.ini/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-title">Instagram</div>
      <div class="social-name">@amun.ini</div>
      <div class="tap">FOLLOW US →</div>
    </a>

    <a
      class="social-card"
      href="https://www.tiktok.com/@amun.ini"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="social-title">TikTok</div>
      <div class="social-name">@amun.ini</div>
      <div class="tap">FOLLOW US →</div>
    </a>

    <div class="footer">
      Your Home in Bohol
    </div>

  </div>

</body>
</html>
